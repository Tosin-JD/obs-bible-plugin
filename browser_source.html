<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/css/browser/browser_style.css">
  <title>Receiver</title>
</head>
<body>
  <div class="bg-container" id="bg-container">
    <video id="bg-video" autoplay loop muted playsinline preload="auto" style="position: absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:0; display:none; border-radius: inherit;"></video>
    <div id="bg-image" style="position: absolute; top:0; left:0; width:100%; height:100%; background-size:cover; background-position:center; z-index:0; display:none; border-radius: inherit;"></div>
    <div id="bg-gradient" style="position: absolute; top:0; left:0; width:100%; height:100%; z-index:0; display:none; border-radius: inherit;"></div>
    <div class="container" id="container" style="position: relative; z-index:1;">
      <div id="message-transition-wrapper" class="message-transition-wrapper">
        <p id="messageDisplay" class=""></p>
      </div>
    </div>
  </div>

  <script src="assets/js/browser_source/browser_app.js"></script>
  <script>
    const bgContainer = document.getElementById("bg-container");
    const messageDisplay = document.getElementById("messageDisplay");
    const bgVideo = document.getElementById("bg-video");
    let currentContentType = null;
    let activeVideoBlobUrl = null;
    let activeVideoSourceKey = null;
    let backgroundApplyToken = 0;
    let activeVideoObjectUrl = null;

    if (bgVideo) {
      bgVideo.loop = true;
      bgVideo.muted = true;
      bgVideo.playsInline = true;

      // Seamless loop reset to prevent stuttering
      const loopVideo = () => {
        bgVideo.currentTime = 0;
        const p = bgVideo.play();
        if (p !== undefined) {
          p.catch(() => {});
        }
      };

      bgVideo.addEventListener("ended", loopVideo);
      bgVideo.addEventListener("pause", () => {
        // If pause triggered near the video end boundary, loop cleanly
        if (bgVideo.style.display !== "none" && bgVideo.duration > 0 && bgVideo.currentTime >= bgVideo.duration - 0.2) {
          loopVideo();
        }
      });
    }

    const idbMedia = {
      dbPromise: null,
      init() {
        if (!this.dbPromise) {
          this.dbPromise = new Promise((resolve) => {
            try {
              const req = indexedDB.open("obs_bible_media_store", 1);
              req.onupgradeneeded = () => req.result.createObjectStore("media");
              req.onsuccess = () => resolve(req.result);
              req.onerror = () => resolve(null);
            } catch (e) {
              resolve(null);
            }
          });
        }
        return this.dbPromise;
      },
      async set(key, val) {
        if (typeof val === "string") {
          try { localStorage.setItem(key, val); } catch (e) {}
        }
        const db = await this.init();
        if (db) {
          const tx = db.transaction("media", "readwrite");
          tx.objectStore("media").put(val, key);
        }
      },
      async get(key) {
        const db = await this.init();
        if (db) {
          const tx = db.transaction("media", "readonly");
          const req = tx.objectStore("media").get(key);
          const res = await new Promise((r) => {
            req.onsuccess = () => r(req.result);
            req.onerror = () => r(null);
          });
          if (res !== undefined && res !== null) return res;
        }
        return localStorage.getItem(key);
      },
      async cacheRemoteMedia(url) {
        if (!url || typeof url !== "string") return null;
        if (url.startsWith("data:") || url.startsWith("blob:")) return null;

        const cacheKey = `cached_blob_${url}`;
        const existing = await this.get(cacheKey);
        if (existing instanceof Blob) {
          return existing;
        }

        try {
          const response = await fetch(url);
          if (!response.ok) return null;
          const blob = await response.blob();
          if (blob && blob.size > 0) {
            await this.set(cacheKey, blob);
            return blob;
          }
        } catch (err) {
          console.warn("Could not cache remote media locally:", err);
        }
        return null;
      },
      async getMediaBlob(url) {
        if (!url || typeof url !== "string") return null;
        if (url.startsWith("data:") || url.startsWith("blob:")) return null;

        const cacheKey = `cached_blob_${url}`;
        const cached = await this.get(cacheKey);
        if (cached instanceof Blob) {
          return cached;
        }
        return null;
      }
    };

    function hexToRgba(hex, alpha) {
      if (!hex) return "rgba(0, 0, 0, 1)";
      hex = hex.replace(/^#/, '');
      let r = parseInt(hex.substring(0, 2), 16) || 0;
      let g = parseInt(hex.substring(2, 4), 16) || 0;
      let b = parseInt(hex.substring(4, 6), 16) || 0;
      let a = parseFloat(alpha);
      if (isNaN(a) || a < 0 || a > 1) a = 1;
      return `rgba(${r}, ${g}, ${b}, ${a})`;
    }

    async function applyBackgroundForType(contentType, force = false) {
      const applyToken = ++backgroundApplyToken;
      if (!contentType) contentType = currentContentType || "text";
      currentContentType = contentType;

      if (force) {
        activeVideoSourceKey = null;
        if (bgVideo) bgVideo.dataset.loadedSrc = "";
      }

      const bgScope = localStorage.getItem("obs-bible-background-scope") || "same";
      const isSeparate = bgScope === "separate";

      // Resolve background mode based on scope
      let bgMode = null;
      if (isSeparate && contentType) {
        bgMode = (await idbMedia.get(`obs-bible-background-mode_${contentType}`))
          || localStorage.getItem(`obs-bible-background-mode_${contentType}`);
      }
      if (!bgMode) {
        bgMode = (await idbMedia.get("obs-bible-background-mode"))
          || localStorage.getItem("obs-bible-background-mode")
          || (await idbMedia.get("obs-bible-background-mode_bible"))
          || localStorage.getItem("obs-bible-background-mode_bible")
          || (await idbMedia.get("obs-bible-background-mode_song"))
          || localStorage.getItem("obs-bible-background-mode_song")
          || (await idbMedia.get("obs-bible-background-mode_text"))
          || localStorage.getItem("obs-bible-background-mode_text")
          || "plain";
      }

      const bgImage = document.getElementById("bg-image");
      const bgGradient = document.getElementById("bg-gradient");

      // Handle Video background smoothly without blinking or interrupting active playback
      let targetVideoUrl = null;
      if (bgMode === "video") {
        if (isSeparate && contentType) {
          targetVideoUrl = (await idbMedia.get(`obs-bible-video-url_${contentType}`))
            || localStorage.getItem(`obs-bible-video-url_${contentType}`);
        }
        if (!targetVideoUrl) {
          targetVideoUrl = (await idbMedia.get("obs-bible-video-url"))
            || (await idbMedia.get("obs-bible-video-url_bible"))
            || (await idbMedia.get("obs-bible-video-url_song"))
            || (await idbMedia.get("obs-bible-video-url_text"))
            || localStorage.getItem("obs-bible-video-url")
            || localStorage.getItem("obs-bible-video-url_bible")
            || localStorage.getItem("obs-bible-video-url_song")
            || localStorage.getItem("obs-bible-video-url_text");
        }
      }

      let isMediaActive = false;

      if (bgVideo && bgImage) {
        if (bgMode === "video" && targetVideoUrl) {
          isMediaActive = true;
          const savedVideoType = (isSeparate && contentType && localStorage.getItem(`obs-bible-video-source-type_${contentType}`))
            || localStorage.getItem("obs-bible-video-source-type") || (/^(data:|blob:)/i.test(targetVideoUrl.trim()) ? "file" : "url");
          let sourceBlob = null;
          if (savedVideoType === "url" && !/^(data:|blob:)/i.test(targetVideoUrl)) sourceBlob = await idbMedia.getMediaBlob(targetVideoUrl);
          if (applyToken !== backgroundApplyToken) return;
          const isGif = /^data:image\/gif/i.test(targetVideoUrl.trim()) || sourceBlob?.type === "image/gif" || (() => {
            try { return new URL(targetVideoUrl, location.href).pathname.toLowerCase().endsWith(".gif"); } catch (_) { return false; }
          })();
          const sourceIdentity = `${savedVideoType}:${contentType}:${targetVideoUrl}`;
          if (isGif) {
            const gifSource = sourceBlob ? URL.createObjectURL(sourceBlob) : targetVideoUrl;
            if (bgImage.dataset.activeGifSource && bgImage.dataset.activeGifSource.startsWith("blob:")) URL.revokeObjectURL(bgImage.dataset.activeGifSource);
            bgImage.style.backgroundImage = `url("${gifSource}")`;
            bgImage.style.display = "block";
            bgImage.dataset.activeGifSource = gifSource;
            if (!bgVideo.paused) bgVideo.pause();
            bgVideo.removeAttribute("src");
            bgVideo.load();
            bgVideo.style.display = "none";
            bgVideo.dataset.loadedSrc = "";
            activeVideoSourceKey = null;
          } else {
            bgImage.style.display = "none";

            // Only update video source if target changed or forced
            if (activeVideoSourceKey !== sourceIdentity) {
              activeVideoSourceKey = sourceIdentity;
              bgVideo.dataset.loadedSrc = sourceIdentity;

              // Check if we already have a cached Blob in IndexedDB
              let playUrl = targetVideoUrl;
              const cachedBlob = sourceBlob || await idbMedia.getMediaBlob(targetVideoUrl);
              if (applyToken !== backgroundApplyToken) return;

              if (cachedBlob) {
                playUrl = URL.createObjectURL(cachedBlob);
                activeVideoObjectUrl = playUrl;
              } else if (!targetVideoUrl.startsWith("data:") && !targetVideoUrl.startsWith("blob:")) {
                // If not yet cached, stream directly and cache in background for future loops
                idbMedia.cacheRemoteMedia(targetVideoUrl).catch(() => {});
              }

              bgVideo.src = playUrl;
              bgVideo.loop = true;
              bgVideo.muted = true;
              bgVideo.style.display = "block";
              bgVideo.play().catch(e => console.error("Video play error:", e));
              if (activeVideoObjectUrl && activeVideoObjectUrl !== playUrl) URL.revokeObjectURL(activeVideoObjectUrl);
              activeVideoObjectUrl = playUrl.startsWith("blob:") ? playUrl : null;
            } else {
              bgVideo.style.display = "block";
              if (bgVideo.paused) {
                bgVideo.play().catch(e => console.error("Video play error:", e));
              }
            }
          }
        } else {
          if (!bgVideo.paused) bgVideo.pause();
          bgVideo.removeAttribute("src");
          bgVideo.load();
          bgVideo.style.display = "none";
          if (bgImage) { bgImage.style.backgroundImage = "none"; bgImage.style.display = "none"; delete bgImage.dataset.activeGifSource; }
          if (activeVideoObjectUrl) { URL.revokeObjectURL(activeVideoObjectUrl); activeVideoObjectUrl = null; }
          bgVideo.dataset.loadedSrc = "";
          activeVideoSourceKey = null;
        }
      }

      // Handle Image background
      let targetImageUrl = null;
      if (bgImage && bgMode !== "video") {
        if (bgMode === "image") {
          if (isSeparate && contentType) {
            targetImageUrl = (await idbMedia.get(`obs-bible-image-url_${contentType}`))
              || localStorage.getItem(`obs-bible-image-url_${contentType}`);
          }
          if (!targetImageUrl) {
            targetImageUrl = (await idbMedia.get("obs-bible-image-url"))
              || (await idbMedia.get("obs-bible-image-url_bible"))
              || (await idbMedia.get("obs-bible-image-url_song"))
              || (await idbMedia.get("obs-bible-image-url_text"))
              || localStorage.getItem("obs-bible-image-url")
              || localStorage.getItem("obs-bible-image-url_bible")
              || localStorage.getItem("obs-bible-image-url_song")
              || localStorage.getItem("obs-bible-image-url_text");
          }
          if (targetImageUrl) {
            isMediaActive = true;
            bgImage.style.backgroundImage = `url("${targetImageUrl}")`;
            bgImage.style.display = "block";
          } else {
            bgImage.style.display = "none";
          }
        } else {
          bgImage.style.display = "none";
        }
      }

      // Handle Gradient background
      let targetGradientCss = null;
      if (bgGradient) {
        if (bgMode === "gradient") {
          if (isSeparate && contentType) {
            targetGradientCss = localStorage.getItem(`obs-bible-gradient-css_${contentType}`);
          }
          if (!targetGradientCss) {
            targetGradientCss = localStorage.getItem('obs-bible-gradient-css')
              || localStorage.getItem('obs-bible-gradient-css_bible')
              || localStorage.getItem('obs-bible-gradient-css_song')
              || localStorage.getItem('obs-bible-gradient-css_text');
          }
          if (targetGradientCss) {
            isMediaActive = true;
            bgGradient.style.backgroundImage = targetGradientCss;
            bgGradient.style.display = "block";
          } else {
            bgGradient.style.display = "none";
          }
        } else {
          bgGradient.style.display = "none";
        }
      }

      // Handle Container Background Color
      const rawColor = (isSeparate && contentType && localStorage.getItem(`obs-bible-bg-color_${contentType}`))
        || localStorage.getItem('obs-bible-bg-color')
        || localStorage.getItem('rawBgColor')
        || localStorage.getItem('bgColor')
        || "#000000";

      const savedOpacity = (isSeparate && contentType
        ? localStorage.getItem(`obs-bible-bg-opacity_${contentType}`)
        : null) ?? localStorage.getItem('obs-bible-bg-opacity') ?? localStorage.getItem('savedOpacity');
      const opacitySteps = Number(savedOpacity);
      const backgroundOpacity = savedOpacity !== null && savedOpacity.trim() !== "" && Number.isFinite(opacitySteps)
        ? Math.round(Math.min(20, Math.max(0, opacitySteps))) / 20
        : 1;
      [bgVideo, bgImage, bgGradient].forEach(layer => {
        if (layer) layer.style.opacity = String(backgroundOpacity);
      });

      if (isMediaActive) {
        bgContainer.style.backgroundColor = "transparent";
      } else if (bgMode === "none") {
        bgContainer.style.backgroundColor = "transparent";
      } else {
        // Fall back gracefully to plain color if media source is unavailable or plain mode, so screen never goes blank!
        bgContainer.style.backgroundColor = hexToRgba(rawColor, backgroundOpacity);
      }
      if (applyToken !== backgroundApplyToken) return;
    }

    // Initialize background immediately when browser source opens
    const initialSavedTab = localStorage.getItem("selectedTab");
    const initialContentType = (initialSavedTab === "bibleText") ? "bible" : (initialSavedTab === "songs") ? "song" : "text";
    applyBackgroundForType(initialContentType);

    function applyTitleColor(color) {
      messageDisplay.style.setProperty("--title-color", color);
      const spans = document.querySelectorAll(
        "#messageDisplay span:not(.bible-content):not(.bible-message):not(.bible-reference):not(.text-animation-char):not(.text-animation-overlay):not(.typewriter-caret)"
      );
      spans.forEach(span => span.style.color = color);
      messageDisplay.querySelectorAll('.text-animation-char[data-title-color="true"]')
        .forEach(span => span.style.color = color);
    }

    // Text channel
    const channel = new BroadcastChannel("myChannel");
    channel.onmessage = (event) => {
      let data = event.data;
      let contentType = "text";
      if (typeof data === "object" && data !== null) {
        contentType = data.contentType || "text";
      } else {
        data = { fadein: false, messageContent: data, contentType: "text" };
      }
      applyBackgroundForType(contentType);
      const titleColor = localStorage.getItem("titleColor");
      if (titleColor) {
          applyTitleColor(titleColor);
          data.titleColor = titleColor;
      }
      updateMessage('messageDisplay', data);
    };

    // settings channel
    const settingsChannel = new BroadcastChannel("settings");
    settingsChannel.onmessage = (event) => {
       if (event.data) {
          if (event.data.backgroundScope) {
            localStorage.setItem("obs-bible-background-scope", event.data.backgroundScope);
            applyBackgroundForType(currentContentType, true);
          }
          if (event.data.bgUpdateContentType) {
            applyBackgroundForType(event.data.bgUpdateContentType === "all" ? currentContentType : event.data.bgUpdateContentType, true);
          }
          if (event.data.backgroundOpacityChanged) {
            applyBackgroundForType(currentContentType);
          }
          if (event.data.selectedFont){
            bgContainer.style.fontFamily = event.data.selectedFont;
            localStorage.setItem('fontFamily', event.data.selectedFont);
          }
          if (event.data.opacityColor){
            bgContainer.style.backgroundColor = event.data.opacityColor;
            localStorage.setItem('bgColor', event.data.opacityColor);
          }
          if (event.data.gradientBackground){
            localStorage.setItem('obs-bible-gradient-css', event.data.gradientBackground);
            applyBackgroundForType(currentContentType, true);
          }
          if (event.data.clearGradient){
            const bgGradient = document.getElementById("bg-gradient");
            if (bgGradient) {
              bgGradient.style.backgroundImage = "none";
              bgGradient.style.display = "none";
            }
            bgContainer.style.backgroundImage = "none";
            localStorage.removeItem('obs-bible-gradient-css');
            if (currentContentType) {
              localStorage.removeItem(`obs-bible-gradient-css_${currentContentType}`);
            }
          }
          if (event.data.roundedCorner !== undefined){
            const radiusPx = event.data.roundedCorner + "px";
            bgContainer.style.borderRadius = radiusPx;
            if (bgVideo) bgVideo.style.borderRadius = radiusPx;
            const bgImage = document.getElementById("bg-image");
            if (bgImage) bgImage.style.borderRadius = radiusPx;
            const bgGradient = document.getElementById("bg-gradient");
            if (bgGradient) bgGradient.style.borderRadius = radiusPx;
            localStorage.setItem('borderRadius', event.data.roundedCorner);
          }
          if (event.data.selectedBgColor){
            bgContainer.style.backgroundColor = event.data.selectedBgColor;
            localStorage.setItem('bgColor', event.data.selectedBgColor);
          }
          if (event.data.selectedFontColor){
            bgContainer.style.color = event.data.selectedFontColor;
            localStorage.setItem('fontColor', event.data.selectedFontColor);
          }
          if (event.data.selectedTitleColor){
            localStorage.setItem('titleColor', event.data.selectedTitleColor);
            applyTitleColor(event.data.selectedTitleColor);
          }
          if (event.data.currentBoldState){
            messageDisplay.style.fontWeight = event.data.currentBoldState;
            localStorage.setItem('boldState', event.data.currentBoldState);
          }
          if (event.data.currentItalicState){
            messageDisplay.style.fontStyle = event.data.currentItalicState;
            localStorage.setItem('italicState', event.data.currentItalicState);
          }
          if (event.data.currentUnderlineState){
            messageDisplay.style.textDecoration = event.data.currentUnderlineState;
            localStorage.setItem('underlineState', event.data.currentUnderlineState);
          }
          if (event.data.selectedBgMargin !== undefined && event.data.selectedBgMargin !== null) {
            const margin = Number(event.data.selectedBgMargin);
            if (Number.isFinite(margin)) {
              const normalizedMargin = Math.round(Math.min(200, Math.max(0, margin)));
              messageDisplay.style.padding = normalizedMargin + "px";
              localStorage.setItem('savedBgMargin', String(normalizedMargin));
            }
            adjustFontSizeBasedOnScroll();
          }
          if (event.data.selectedTextAlignment){
            messageDisplay.style.textAlign = event.data.selectedTextAlignment;
            localStorage.setItem('textAlign', event.data.selectedTextAlignment);
          }
          if (event.data.selectedShadowColor){
            messageDisplay.style.textShadow = event.data.selectedShadowColor;
            localStorage.setItem('savedShadowColor', event.data.selectedShadowColor);
          }
          if (event.data.fontOutline){
            let savedFontOutlineColor = localStorage.getItem('obs-bible-saved-font-outline-color');
            if(!savedFontOutlineColor){
              savedFontOutlineColor = "#000000";
            }
            messageDisplay.style.webkitTextStroke = `${event.data.fontOutline}px ${savedFontOutlineColor}`;
            localStorage.setItem('obs-bible-saved-font-outline', event.data.fontOutline);
          }
          if (event.data.fontOutlineColor){
            let savedFontOutline = Number(localStorage.getItem('obs-bible-saved-font-outline'));
            if(!savedFontOutline){
              savedFontOutline = 0;
            }
            messageDisplay.style.webkitTextStroke = `${savedFontOutline}px ${event.data.fontOutlineColor}`;
            localStorage.setItem('obs-bible-saved-font-outline-color', event.data.fontOutlineColor);
          }
          if (event.data.mainBorder){
            let mainBorderColor = localStorage.getItem('obs-bible-saved-main-border-color');
            let savedMainBorderType = localStorage.getItem('obs-bible-saved-main-border-type');
            if(!mainBorderColor){
              mainBorderColor = "#000000";
            }
            if(!savedMainBorderType){
              savedMainBorderType = 'solid';
            }
            bgContainer.style.border = `${event.data.mainBorder}px ${mainBorderColor}  ${savedMainBorderType}`;
            localStorage.setItem('obs-bible-saved-main-border', event.data.mainBorder);
          }
          if (event.data.mainBorderColor){
            let savedMainBorder = Number(localStorage.getItem('obs-bible-saved-main-border'));
            let savedMainBorderType = localStorage.getItem('obs-bible-saved-main-border-type');
            if(!savedMainBorder){
              savedMainBorder = 0;
            }
            if(!savedMainBorderType){
              savedMainBorderType = 'solid';
            }
            bgContainer.style.border = `${savedMainBorder}px ${event.data.mainBorderColor} ${savedMainBorderType}`;
            localStorage.setItem('obs-bible-saved-main-border-color', event.data.mainBorderColor);
          }
          if (event.data.mainBorderType){
            let savedMainBorder = Number(localStorage.getItem('obs-bible-saved-main-border'));
            let savedMainBorderColor = localStorage.getItem('obs-bible-saved-main-border-color');
            if(!savedMainBorder){
              savedMainBorder = 0;
            }
            if(!savedMainBorderColor){
              savedMainBorderColor = '#000000';
            }
            bgContainer.style.border = `${savedMainBorder}px ${savedMainBorderColor} ${event.data.mainBorderType}`;
            localStorage.setItem('obs-bible-saved-main-border-type', event.data.mainBorderType);
          }
          adjustFontSizeBasedOnScroll();
        }
    };

    window.addEventListener('beforeunload', () => {
        settingsChannel.close();
    });
  </script>


  <script>
        const receiveChannel = new BroadcastChannel("obs-bible-animation");
        receiveChannel.onmessage = (event) => {
          const animatedElement = document.getElementById('messageDisplay');
          const animationContainer = document.getElementById('bg-container');
          const { type, duration, easing, display } = event.data;
          animationContainer.style.animationDuration = `${duration}s`;

          if (display === 'none') {
            animationContainer.classList.add(type);
            animationContainer.style.animationDirection = "reverse";
            setTimeout(() => {
              animationContainer.style.display = 'none';
              animationContainer.classList.remove(type);
            }, duration * 1000);
          } else if (display === 'flex') {
            animationContainer.style.animationDirection = "normal";
            animationContainer.classList.add(type);
            animationContainer.style.display = 'flex';
            adjustFontSizeBasedOnScroll(animatedElement);
            setTimeout(() => {
              animationContainer.classList.remove(type);
            }, duration * 1000);
          }
        };
    </script>
  <script src="assets/js/browser_source/load_browser_settings.js"></script>
</body>
</html>
